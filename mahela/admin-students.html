<!DOCTYPE html>

<body>

			</div>
		</a>
		<nav class="sidebar__nav">
			<a href="admin-dashboard.html" class="sidebar__link">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="12" width="8" height="9" rx="2"/><rect x="3" y="14" width="8" height="7" rx="2"/></svg>
				<span data-i18n="nav_admin_dashboard">Admin Dashboard</span>
			</a>
			<a href="admin-teachers.html" class="sidebar__link">

				<span data-i18n="nav_admin_teachers">Teachers</span>
			</a>
			<a href="admin-students.html" class="sidebar__link is-active">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="12" width="8" height="9" rx="2"/><rect x="3" y="14" width="8" height="7" rx="2"/></svg>
				<span data-i18n="nav_admin_students">Students</span>
			</a>
			<a href="admin-inbox.html" class="sidebar__link">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
				<span data-i18n="nav_admin_inbox">Inbox</span>
				<span class="badge badge--brand" id="admin-inbox-badge" style="margin-inline-start:auto; display:none;">0</span>
			</a>
			<a href="settings.html?role=admin" class="sidebar__link">

				<span data-i18n="nav_settings">Settings</span>
			</a>
		</nav>
		<div class="sidebar__footer">
			<div class="sidebar__user">
				<span class="sidebar__avatar" style="background: var(--c-ink); color:#fff;">SA</span>
				<div class="sidebar__user-info">
					<span class="sidebar__user-name">Site Admin</span>
					<span class="sidebar__user-role" data-i18n="admin_super_admin">Super Admin</span>
				</div>
			</div>
			<a href="admin-login.html" class="sidebar__link">

				<span data-i18n="nav_logout">Log Out</span>
			</a>
			<div class="sidebar__version">MahFLA v1.38.0</div>
		</div>
	</aside>

	<div class="main-content">
		<header class="topbar-app">
			<div class="topbar-app__left">
				<button type="button" class="toggle-btn sidebar-toggle" data-sidebar-toggle aria-label="Menu">
					<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
				</button>
				<div class="clock-widget hide-mobile" data-clock-widget>
					<span class="clock-widget__icon">
						<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
					</span>
					<div class="clock-widget__dates">
						<span class="clock-widget__time" data-clock-time>--:--:--</span>
						<span class="clock-widget__date"><span data-clock-gregorian>—</span><span data-clock-sep> | </span><span data-clock-jalali>—</span></span>
					</div>
				</div>
			</div>
			<div class="utility-toggles">
				<button type="button" class="toggle-btn lang-toggle" data-lang-btn>FA</button>
				<button type="button" class="toggle-btn" data-theme-btn aria-label="Toggle theme">
					<svg data-icon-moon viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
					<svg data-icon-sun viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
				</button>
			</div>
		</header>

		<div class="page-body">
			<div class="page-head reveal-on-load" style="--rl-delay:0ms">
				<h1 class="page-head__title" data-i18n="admin_students_title">Students</h1>
				<p class="page-head__sub" data-i18n="admin_students_sub">Every student across every teacher.</p>
			</div>

			<div class="toolbar">
				<div class="search-input">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
					<input type="text" id="admin-student-search" data-i18n-ph="dash_search_ph" placeholder="Search students…">
				</div>
			</div>

			<div class="card reveal-on-load" style="--rl-delay:80ms; padding:0;">
				<div class="data-table-wrap">
					<table class="data-table">
						<thead>
							<tr>
								<th data-i18n="col_name">Name</th>
								<th data-i18n="col_teacher">Teacher</th>
								<th data-i18n="col_email">Email</th>
								<th data-i18n="col_phone">Phone</th>
								<th data-i18n="col_level">Level</th>
								<th style="text-align:end;" data-i18n="col_actions">Actions</th>
							</tr>
						</thead>
						<tbody id="students-tbody"></tbody>
					</table>
				</div>
			</div>
			<p id="admin-students-no-results" style="display:none; text-align:center; color:var(--ink-faint); padding:30px 0;">No students match your search.</p>
		</div>
	</div>
</div>

<!-- Reset password modal -->
<div class="modal-overlay" id="modal-reset-password">
	<div class="modal-box">
		<div class="modal-box__head">
			<h2 class="modal-box__title" data-i18n="modal_reset_password_title">Reset Password</h2>
			<button type="button" class="modal-box__close" data-modal-close aria-label="Close">&times;</button>
		</div>
		<p style="font-size:13px; color:var(--ink-soft); margin-top:-10px; margin-bottom:18px;" id="reset-password-student-name">—</p>
		<form id="reset-password-form">
			<div class="form-field" style="margin-bottom:0;">
				<label data-i18n="field_new_password_admin" for="reset-password-value">New Password</label>
				<input type="text" dir="ltr" id="reset-password-value" required>
			</div>
			<div class="form-actions">
				<button type="button" class="btn btn--ghost" data-modal-close data-i18n="btn_cancel">Cancel</button>
				<button type="submit" class="btn btn--primary" data-i18n="settings_save_password">Update Password</button>
			</div>
		</form>
	</div>
</div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/clock.js"></script>
<script src="assets/js/roster-data.js"></script>
<script src="assets/js/sessions-data.js"></script>
<script src="assets/js/app.js"></script>
<script>
	function initials( name ) {
		return name.split( ' ' ).map( function ( p ) { return p[ 0 ]; } ).join( '' ).slice( 0, 2 ).toUpperCase();
	}

	function allStudentsWithTeacherNames() {
		var students = window.mahtelaRoster.loadStudents();
		var teachers = window.mahtelaRoster.loadTeachers();
		return Object.keys( students ).map( function ( key ) {
			var s = students[ key ];
			var teacher = teachers[ s.teacherId ];
			return {
				key: s.key, name: s.name, gender: s.gender, photo: s.photo,
				teacher: teacher ? teacher.name : '—',
				email: s.email, phone: s.phone, level: s.level
			};
		} );
	}

	function renderStudents( list ) {
		var tbody = document.getElementById( 'students-tbody' );
		tbody.innerHTML = '';
		var lang = window.mahtelaI18n.currentLang();

		list.forEach( function ( s ) {
			var tr = document.createElement( 'tr' );
			tr.setAttribute( 'data-gender', s.gender );
			tr.innerHTML =
				'<td><div class="data-table__user">' +
					'<span class="data-table__avatar">' + window.mahtelaRoster.avatarHTML( s, initials( s.name ) ) + '</span>' +
					'<span class="data-table__name">' + s.name + '</span>' +
				'</div></td>' +
				'<td>' + s.teacher + '</td>' +
				'<td>' + s.email + '</td>' +
				'<td dir="ltr" style="text-align:end;">' + s.phone + '</td>' +
				'<td><span class="badge badge--accent">' + s.level + '</span></td>' +
				'<td><div class="data-table__actions">' +
					'<a href="student-detail.html?student=' + s.key + '&viewer=admin" class="data-table__icon-btn" aria-label="' + window.mahtelaI18n.dict.action_view_profile[ lang ] + '" title="' + window.mahtelaI18n.dict.action_view_profile[ lang ] + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg></a>' +
					'<button type="button" class="data-table__icon-btn" data-action="reset-password" data-name="' + s.name + '" data-email="' + s.email + '" aria-label="' + window.mahtelaI18n.dict.action_reset_password[ lang ] + '" title="' + window.mahtelaI18n.dict.action_reset_password[ lang ] + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>' +
				'</div></td>';
			tbody.appendChild( tr );
		} );

		document.getElementById( 'admin-students-no-results' ).style.display = list.length === 0 ? 'block' : 'none';
	}

	renderStudents( allStudentsWithTeacherNames() );
	document.addEventListener( 'mahtela:langchange', function () { renderStudents( currentFiltered() ); } );
	document.addEventListener( 'mahtela:studentschange', function () { renderStudents( currentFiltered() ); } );
	document.addEventListener( 'mahtela:teacherschange', function () { renderStudents( currentFiltered() ); } );

	function currentFiltered() {
		var all = allStudentsWithTeacherNames();
		var q = document.getElementById( 'admin-student-search' ).value.trim().toLowerCase();
		if ( ! q ) { return all; }
		return all.filter( function ( s ) {
			return s.name.toLowerCase().indexOf( q ) !== -1 || s.teacher.toLowerCase().indexOf( q ) !== -1;
		} );
	}

	document.getElementById( 'admin-student-search' ).addEventListener( 'input', function () {
		renderStudents( currentFiltered() );
	} );

	document.getElementById( 'students-tbody' ).addEventListener( 'click', function ( e ) {
		var btn = e.target.closest( 'button[data-action="reset-password"]' );
		if ( ! btn ) { return; }
		document.getElementById( 'reset-password-student-name' ).textContent = btn.getAttribute( 'data-name' ) + ' — ' + btn.getAttribute( 'data-email' );
		document.getElementById( 'reset-password-value' ).value = '';
		window.mahtelaModal.open( document.getElementById( 'modal-reset-password' ), btn );
	} );

	document.getElementById( 'reset-password-form' ).addEventListener( 'submit', function ( e ) {
		e.preventDefault();
		window.mahtelaModal.close( document.getElementById( 'modal-reset-password' ) );
		mahtelaToast( 'Password reset and emailed to the student.' );
	} );
</script>
</body>
</html>
