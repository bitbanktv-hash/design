					<svg data-icon-sun viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>

		<div class="page-body">
			<div class="page-head reveal-on-load" style="--rl-delay:0ms">

				<p class="page-head__sub" data-i18n="admin_inbox_sub">Messages from the public Contact Us form.</p>
			</div>

			<div class="card reveal-on-load" style="--rl-delay:80ms; padding:24px;">
				<div id="inbox-list"></div>
				<p id="inbox-empty" style="display:none; text-align:center; color:var(--ink-faint); padding:40px 0; margin:0;" data-i18n="admin_inbox_empty">No messages yet.</p>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/clock.js"></script>
<script src="assets/js/roster-data.js"></script>
<script src="assets/js/sessions-data.js"></script>
<script src="assets/js/app.js"></script>
<script>
	function escapeHtml( s ) {
		var d = document.createElement( 'div' );
		d.textContent = s;
		return d.innerHTML;
	}

	function renderInboxList() {
		var lang = window.mahtelaI18n.currentLang();
		var dict = window.mahtelaI18n.dict;
		var entries = window.mahtelaData.loadAdminInbox();
		var list = document.getElementById( 'inbox-list' );
		list.innerHTML = '';

		entries.forEach( function ( entry ) {
			var row = document.createElement( 'div' );
			row.className = 'inbox-row' + ( entry.read ? '' : ' is-unread' );
			row.setAttribute( 'data-id', entry.id );

			var teacherNote = entry.teacherContext
				? '<div class="inbox-row__context">' + ( lang === 'fa' ? 'درباره‌ی: ' : 'About: ' ) + escapeHtml( entry.teacherContext ) + '</div>'
				: '';

			row.innerHTML =
				'<button type="button" class="inbox-row__head">' +
					'<span class="inbox-row__dot" aria-hidden="true"></span>' +
					'<div class="inbox-row__who">' +
						'<strong></strong>' +
						'<span class="inbox-row__email" dir="ltr"></span>' +
					'</div>' +
					'<span class="inbox-row__date" data-date="' + entry.createdAt.slice( 0, 10 ) + '" data-date-style="full"></span>' +
				'</button>' +
				'<div class="inbox-row__body" style="display:none;">' +
					teacherNote +
					'<p class="inbox-row__message"></p>' +
					'<div class="inbox-row__meta"></div>' +
					'<button type="button" class="btn btn--ghost btn--small" data-action="delete">' + dict.admin_inbox_delete[ lang ] + '</button>' +
				'</div>';

			row.querySelector( '.inbox-row__who strong' ).textContent = entry.name;
			row.querySelector( '.inbox-row__email' ).textContent = entry.email;
			row.querySelector( '.inbox-row__message' ).textContent = entry.message;
			var metaParts = [];
			if ( entry.phone ) { metaParts.push( dict.settings_phone[ lang ] + ': ' + entry.phone ); }
			row.querySelector( '.inbox-row__meta' ).textContent = metaParts.join( ' · ' );

			row.querySelector( '.inbox-row__head' ).addEventListener( 'click', function () {
				var body = row.querySelector( '.inbox-row__body' );
				var isOpen = body.style.display !== 'none';
				body.style.display = isOpen ? 'none' : 'block';
				if ( ! isOpen && ! entry.read ) {
					var all = window.mahtelaData.loadAdminInbox();
					var target = all.filter( function ( e ) { return e.id === entry.id; } )[ 0 ];
					if ( target ) { target.read = true; window.mahtelaData.saveAdminInbox( all ); }
					row.classList.remove( 'is-unread' );
				}
			} );

			row.querySelector( '[data-action="delete"]' ).addEventListener( 'click', function ( e ) {
				e.stopPropagation();
				var all = window.mahtelaData.loadAdminInbox().filter( function ( en ) { return en.id !== entry.id; } );
				window.mahtelaData.saveAdminInbox( all );
				renderInboxList();
			} );

			list.appendChild( row );
		} );

		document.getElementById( 'inbox-empty' ).style.display = entries.length ? 'none' : 'block';
		window.mahtelaCalendar.applyScheduleDates();
	}

	renderInboxList();
	document.addEventListener( 'mahtela:langchange', renderInboxList );
	document.addEventListener( 'mahtela:calendarchange', renderInboxList );
</script>
</body>
