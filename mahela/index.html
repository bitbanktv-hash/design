<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MahELA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/animations.css">
<style>
	.landing {
		min-height: 100vh;
		display: flex; flex-direction: column;
		position: relative;
		overflow: hidden;
	}
	.landing__topline {
		display: flex; align-items: center; justify-content: space-between;
		padding: 22px 28px;
		position: relative; z-index: 2;
	}
	.landing__main {
		flex: 1;
		display: flex; align-items: center; justify-content: center;
		text-align: center;
		padding: 40px 24px 80px;
		position: relative; z-index: 2;
	}
	.landing__title {
		font-size: clamp(52px, 10vw, 108px);
		font-weight: 800;
		background: linear-gradient(120deg, var(--c-pink) 0%, var(--c-orange) 45%, var(--c-teal) 100%);
		-webkit-background-clip: text; background-clip: text; color: transparent;
		margin-bottom: 6px;
		letter-spacing: -0.02em;
	}
	.landing__tagline { font-size: 13px; font-weight: 600; color: var(--ink-faint); letter-spacing: .02em; margin-bottom: 26px; }
	.landing__welcome { font-size: 17px; max-width: 460px; margin: 0 auto 34px; }
	.landing__footer {
		text-align: center; padding: 22px; font-size: 12.5px; color: var(--ink-faint);
		position: relative; z-index: 2;
	}
</style>
</head>
<body>

<div class="landing">
	<div class="radar-bg radar-bg--ambient" id="landing-radar-bg" aria-hidden="true"></div>

	<div class="landing__topline">
		<div class="clock-widget" data-clock-widget>
			<span class="clock-widget__icon">
				<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
			</span>
			<div class="clock-widget__dates">
				<span class="clock-widget__time" data-clock-time>--:--:--</span>
				<span class="clock-widget__date"><span data-clock-gregorian>—</span><span data-clock-sep> | </span><span data-clock-jalali>—</span></span>
			</div>
		</div>

		<div class="utility-toggles">
			<button type="button" class="toggle-btn lang-toggle" data-lang-btn>FA</button>
			<button type="button" class="toggle-btn" data-theme-btn aria-label="Toggle theme">
				<svg data-icon-moon viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
				<svg data-icon-sun viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
			</button>
		</div>
	</div>

	<div class="landing__main">
		<div class="reveal-on-load" style="--rl-delay:0ms">
			<h1 class="landing__title" data-i18n="brand_name">MahELA</h1>
			<p class="landing__tagline" data-i18n="brand_tagline">Mahta English Learning Academy</p>
			<p class="landing__welcome" data-i18n="landing_welcome">Welcome! Track your progress, see your schedule, and stay in touch with your teacher — all in one place.</p>
			<a href="login.html" class="btn btn--primary btn--large" data-i18n="landing_cta">Enter Panel</a>
		</div>
	</div>

	<div class="landing__footer" data-i18n="footer_credit">Designed by Acc Manager</div>
</div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/clock.js"></script>
<script src="assets/js/app.js"></script>
<script>
	// Signature ambient background: a large, softly rotating radar/web
	// pattern behind the hero — echoes the skill-radar feature even before
	// login, without stealing focus from the title.
	( function () {
		var host = document.getElementById( 'landing-radar-bg' );
		var size = 900;
		var center = size / 2;
		var rings = [ 0.25, 0.5, 0.75, 1 ];
		var maxR = 420;
		var axes = 4;

		function point( angleDeg, r ) {
			var rad = ( angleDeg - 90 ) * ( Math.PI / 180 );
			return { x: center + r * Math.cos( rad ), y: center + r * Math.sin( rad ) };
		}

		var svg = document.createElementNS( 'http://www.w3.org/2000/svg', 'svg' );
		svg.setAttribute( 'viewBox', '0 0 ' + size + ' ' + size );
		svg.setAttribute( 'width', size );
		svg.setAttribute( 'height', size );
		svg.style.position = 'absolute';
		svg.style.top = '50%';
		svg.style.left = '50%';
		svg.style.transform = 'translate(-50%,-50%)';

		rings.forEach( function ( frac ) {
			var pts = [];
			for ( var i = 0; i < axes; i++ ) { pts.push( point( i * ( 360 / axes ), maxR * frac ) ); }
			var poly = document.createElementNS( 'http://www.w3.org/2000/svg', 'polygon' );
			poly.setAttribute( 'points', pts.map( function ( p ) { return p.x + ',' + p.y; } ).join( ' ' ) );
			poly.setAttribute( 'fill', 'none' );
			poly.setAttribute( 'stroke', 'var(--border)' );
			poly.setAttribute( 'stroke-width', '1.5' );
			svg.appendChild( poly );
		} );

		for ( var i = 0; i < axes; i++ ) {
			var outer = point( i * ( 360 / axes ), maxR );
			var line = document.createElementNS( 'http://www.w3.org/2000/svg', 'line' );
			line.setAttribute( 'x1', center ); line.setAttribute( 'y1', center );
			line.setAttribute( 'x2', outer.x ); line.setAttribute( 'y2', outer.y );
			line.setAttribute( 'stroke', 'var(--border)' );
			line.setAttribute( 'stroke-width', '1.5' );
			svg.appendChild( line );
		}

		host.appendChild( svg );
	}() );
</script>
</body>
</html>
