<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Messages — MahELA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/animations.css">
</head>
<body>

<div class="app-shell">
	<div class="sidebar-backdrop" data-sidebar-toggle></div>

	<aside class="sidebar">
		<div class="sidebar__brand">
			<span class="sidebar__logo">M</span>
			<div class="sidebar__brand-text">
				<span class="sidebar__brand-name" data-i18n="brand_name">MahELA</span>
				<span class="sidebar__brand-tagline" data-i18n="brand_tagline">Mahta English Learning Academy</span>
			</div>
		</div>
		<nav class="sidebar__nav">
			<a href="teacher-dashboard.html" class="sidebar__link">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
				<span data-i18n="nav_dashboard">Dashboard</span>
			</a>
			<a href="teacher-schedule.html" class="sidebar__link">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
				<span data-i18n="nav_schedule">Schedule</span>
			</a>
			<a href="messages.html" class="sidebar__link is-active">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
				<span data-i18n="nav_messages">Messages</span>
			</a>
			<a href="settings.html?role=teacher" class="sidebar__link">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.35a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.65 15a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.65 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.65a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 0 1 4 0v.09A1.7 1.7 0 0 0 15 4.65a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.35 9a1.7 1.7 0 0 0 1.56 1.04H21a2 2 0 0 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15Z"/></svg>
				<span data-i18n="nav_settings">Settings</span>
			</a>
		</nav>
		<div class="sidebar__footer">
			<div class="sidebar__user">
				<span class="sidebar__avatar" style="background: var(--c-pink); color:var(--c-ink);">JD</span>
				<div class="sidebar__user-info">
					<span class="sidebar__user-name">Jane Doe</span>
					<span class="sidebar__user-role">English Teacher</span>
				</div>
			</div>
			<a href="login.html" class="sidebar__link">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
				<span data-i18n="nav_logout">Log Out</span>
			</a>
			<div class="sidebar__version">MahELA v1.8.0</div>
		</div>
	</aside>

	<div class="main-content">
		<header class="topbar-app">
			<div class="topbar-app__left">
				<button type="button" class="toggle-btn sidebar-toggle" data-sidebar-toggle aria-label="Menu">
					<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
				</button>
				<div class="clock-widget hide-mobile" data-clock-widget>
					<span class="clock-widget__icon">
						<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
					</span>
					<div class="clock-widget__dates">
						<span class="clock-widget__time" data-clock-time>--:--:--</span>
						<span class="clock-widget__date"><span data-clock-gregorian>—</span><span data-clock-sep> | </span><span data-clock-jalali>—</span></span>
					</div>
				</div>
			</div>
			<div class="utility-toggles">
				<button type="button" class="toggle-btn lang-toggle" data-lang-btn>FA</button>
				<button type="button" class="toggle-btn" data-theme-btn aria-label="Toggle theme">
					<svg data-icon-moon viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
					<svg data-icon-sun viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
				</button>
			</div>
		</header>

		<div class="page-body">
			<div class="page-head reveal-on-load" style="--rl-delay:0ms">
				<h1 class="page-head__title" data-i18n="messages_title">Messages</h1>
				<p class="page-head__sub" data-i18n="messages_sub">Every conversation with your students, in one place.</p>
			</div>

			<div class="messages-layout reveal-on-load" style="--rl-delay:80ms">
				<div class="card" style="padding:0;">
					<div style="padding:14px 14px 8px;">
						<div class="search-input" style="max-width:none;">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
							<input type="text" id="conversation-search" data-i18n-ph="messages_search_ph" placeholder="Search conversations…">
						</div>
					</div>
					<div class="chat-list" id="conversation-list"></div>
					<p id="conversations-no-results" style="display:none; text-align:center; color:var(--ink-faint); padding:20px 0;" data-i18n="messages_no_results">No conversations match your search.</p>
				</div>

				<div class="card chat-panel" style="padding:24px;" id="active-thread-panel">
					<div class="chat-panel__thread" id="chat-thread"></div>
					<div class="chat-composer">
						<div class="chat-composer__toolbar">
							<button type="button" class="chat-composer__tool" data-cmd="bold" data-i18n-aria="messages_bold" aria-label="Bold" title="Bold"><b>B</b></button>
							<button type="button" class="chat-composer__tool" data-cmd="italic" data-i18n-aria="messages_italic" aria-label="Italic" title="Italic"><i>I</i></button>
							<button type="button" class="chat-composer__tool" data-emoji-toggle aria-haspopup="true" aria-expanded="false" data-i18n-aria="messages_emoji" aria-label="Insert emoji" title="Insert emoji">🙂</button>
							<div class="chat-composer__emoji-popover" hidden></div>
						</div>
						<div class="chat-composer__body">
							<div class="chat-composer__input" contenteditable="true" role="textbox" aria-multiline="true" id="composer-input" data-i18n-ph="messages_placeholder" data-placeholder="Type a message…"></div>
							<button type="button" class="btn btn--primary btn--small chat-composer__send" data-i18n="messages_send">Send</button>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/clock.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/chat.js"></script>
<script>
	var CONVERSATIONS = {
		elena: {
			name: 'Elena Kim', initials: 'EK', gender: 'female',
			messages: [
				{ dir: 'in',  html: 'Hi! Just wanted to check — are we still on for Wednesday at 5?', time: 'Yesterday, 14:02' },
				{ dir: 'out', html: "Yes, all set! I'll send the reading passage beforehand.", time: 'Yesterday, 14:10' },
				{ dir: 'in',  html: 'Perfect, thank you!', time: 'Yesterday, 14:11' }
			]
		},
		daniel: {
			name: 'Daniel Cruz', initials: 'DC', gender: 'male',
			messages: [
				{ dir: 'in', html: 'Sorry, can we move Thursday to 11 instead of 10?', time: 'Mon, 09:20' },
				{ dir: 'out', html: 'Sure, 11:00 works. See you then!', time: 'Mon, 09:24' }
			]
		},
		sara: {
			name: 'Sara Ahmadi', initials: 'SA', gender: 'female',
			messages: [
				{ dir: 'in', html: "Thanks for today's session, the essay feedback was really helpful.", time: 'Fri, 18:40' }
			]
		},
		marco: {
			name: 'Marco Rossi', initials: 'MR', gender: 'male',
			messages: [
				{ dir: 'out', html: 'Reminder: bring your workbook to the next class.', time: 'Wed, 20:05' },
				{ dir: 'in', html: '👍 got it', time: 'Wed, 20:07' }
			]
		},
		yuki: {
			name: 'Yuki Tanaka', initials: 'YT', gender: 'female',
			messages: [
				{ dir: 'in', html: 'Can we reschedule this week?', time: 'Sun, 12:00' },
				{ dir: 'out', html: 'Of course — what day works better for you?', time: 'Sun, 12:15' }
			]
		}
	};

	var CONVERSATION_ORDER = [ 'elena', 'daniel', 'sara', 'marco', 'yuki' ];
	var activeKey = null;

	function lastMessage( key ) {
		var msgs = CONVERSATIONS[ key ].messages;
		return msgs.length ? msgs[ msgs.length - 1 ] : null;
	}

	function plainText( html ) {
		var el = document.createElement( 'div' );
		el.innerHTML = html;
		return el.textContent || '';
	}

	function renderConversationList( filterText ) {
		var list = document.getElementById( 'conversation-list' );
		list.innerHTML = '';
		var q = ( filterText || '' ).trim().toLowerCase();
		var shown = 0;

		CONVERSATION_ORDER.forEach( function ( key ) {
			var convo = CONVERSATIONS[ key ];
			if ( q && convo.name.toLowerCase().indexOf( q ) === -1 ) { return; }
			shown++;

			var last = lastMessage( key );
			var btn = document.createElement( 'button' );
			btn.type = 'button';
			btn.className = 'chat-list__item' + ( key === activeKey ? ' is-active' : '' );
			btn.setAttribute( 'data-gender', convo.gender );
			btn.setAttribute( 'aria-current', key === activeKey ? 'true' : 'false' );
			btn.innerHTML =
				'<span class="chat-list__avatar">' + convo.initials + '</span>' +
				'<span class="chat-list__body">' +
					'<span class="chat-list__name">' + convo.name + '</span>' +
					'<span class="chat-list__preview">' + ( last ? plainText( last.html ) : '' ) + '</span>' +
				'</span>' +
				'<span class="chat-list__meta"><span class="chat-list__time">' + ( last ? last.time : '' ) + '</span></span>';
			btn.addEventListener( 'click', function () { selectConversation( key ); } );
			list.appendChild( btn );
		} );

		document.getElementById( 'conversations-no-results' ).style.display = shown === 0 ? 'block' : 'none';
	}

	function renderThread( key ) {
		var convo = CONVERSATIONS[ key ];
		var thread = document.getElementById( 'chat-thread' );
		document.getElementById( 'active-thread-panel' ).setAttribute( 'data-gender', convo.gender );
		thread.innerHTML = '';

		convo.messages.forEach( function ( m ) {
			var bubble = document.createElement( 'div' );
			bubble.className = 'message-bubble message-bubble--' + m.dir;
			var avatar = m.dir === 'in'
				? '<span class="message-bubble__avatar">' + convo.initials + '</span>'
				: '';
			var avatarOut = m.dir === 'out'
				? '<span class="message-bubble__avatar" style="background:var(--c-pink); color:var(--c-ink);">JD</span>'
				: '';
			bubble.innerHTML =
				avatar +
				'<div class="message-bubble__content"><div class="message-bubble__text">' + m.html + '</div><span class="message-bubble__time">' + m.time + '</span></div>' +
				avatarOut;
			thread.appendChild( bubble );
		} );
		thread.scrollTop = thread.scrollHeight;
	}

	function selectConversation( key ) {
		if ( ! CONVERSATIONS[ key ] ) { return; }
		activeKey = key;
		renderConversationList( document.getElementById( 'conversation-search' ).value );
		renderThread( key );
		if ( history.replaceState ) { history.replaceState( null, '', '?student=' + key ); }
		document.getElementById( 'composer-input' ).focus();
	}

	document.getElementById( 'conversation-search' ).addEventListener( 'input', function ( e ) {
		renderConversationList( e.target.value );
	} );

	document.querySelector( '.chat-composer' ).addEventListener( 'chat-composer:send', function ( e ) {
		if ( ! activeKey ) { return; }
		CONVERSATIONS[ activeKey ].messages.push( { dir: 'out', html: e.detail.html, time: window.mahtelaI18n.currentLang() === 'fa' ? 'اکنون' : 'Just now' } );
		renderThread( activeKey );
		renderConversationList( document.getElementById( 'conversation-search' ).value );
	} );

	document.addEventListener( 'mahtela:langchange', function () {
		renderConversationList( document.getElementById( 'conversation-search' ).value );
	} );

	var params = new URLSearchParams( window.location.search );
	var initialKey = params.get( 'student' );
	selectConversation( ( initialKey && CONVERSATIONS[ initialKey ] ) ? initialKey : CONVERSATION_ORDER[ 0 ] );
</script>
</body>
</html>
