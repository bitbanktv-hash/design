	<div class="main-content">
		<header class="topbar-app">
			<div class="topbar-app__left">
				<button type="button" class="toggle-btn sidebar-toggle" data-sidebar-toggle aria-label="Menu">
					<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
				</button>
				<div class="clock-widget hide-mobile" data-clock-widget>
					<span class="clock-widget__icon">
						<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
					</span>
					<div class="clock-widget__dates">
						<span class="clock-widget__time" data-clock-time>--:--:--</span>
						<span class="clock-widget__date"><span data-clock-gregorian>—</span><span data-clock-sep> | </span><span data-clock-jalali>—</span></span>
					</div>
				</div>
			</div>
			<div class="utility-toggles">
				<button type="button" class="toggle-btn lang-toggle" data-lang-btn>FA</button>
				<button type="button" class="toggle-btn" data-theme-btn aria-label="Toggle theme">
					<svg data-icon-moon viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
					<svg data-icon-sun viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
				</button>
			</div>
		</header>

		<div class="page-body">
			<div class="page-head reveal-on-load" style="--rl-delay:0ms">
				<h1 class="page-head__title" data-i18n="messages_title">Messages</h1>
				<p class="page-head__sub" data-i18n="messages_sub">Every conversation with your students, in one place.</p>
			</div>

			<div class="messages-layout reveal-on-load" style="--rl-delay:80ms">
				<div class="card" style="padding:0;">
					<div style="padding:14px 14px 8px;">
						<div class="search-input" style="max-width:none;">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
							<input type="text" id="conversation-search" data-i18n-ph="messages_search_ph" placeholder="Search conversations…">
						</div>
					</div>
					<div class="chat-list" id="conversation-list"></div>
					<p id="conversations-no-results" style="display:none; text-align:center; color:var(--ink-faint); padding:20px 0;" data-i18n="messages_no_results">No conversations match your search.</p>
				</div>

				<div class="card chat-panel" style="padding:24px;" id="active-thread-panel">
					<div class="chat-panel__thread" id="chat-thread"></div>
					<div class="chat-composer">
						<div class="chat-composer__toolbar">
							<button type="button" class="chat-composer__tool" data-cmd="bold" data-i18n-aria="messages_bold" aria-label="Bold" title="Bold"><b>B</b></button>
							<button type="button" class="chat-composer__tool" data-cmd="italic" data-i18n-aria="messages_italic" aria-label="Italic" title="Italic"><i>I</i></button>
							<button type="button" class="chat-composer__tool" data-emoji-toggle aria-haspopup="true" aria-expanded="false" data-i18n-aria="messages_emoji" aria-label="Insert emoji" title="Insert emoji">🙂</button>
							<div class="chat-composer__emoji-popover" hidden></div>
						</div>
						<div class="chat-composer__body">
							<div class="chat-composer__input" contenteditable="true" role="textbox" aria-multiline="true" id="composer-input" data-i18n-ph="messages_placeholder" data-placeholder="Type a message…"></div>
							<button type="button" class="btn btn--primary btn--small chat-composer__send" data-i18n="messages_send">Send</button>
						</div>
					</div>
				</div>
			</div>
		</div>

</div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/clock.js"></script>
<script src="assets/js/sessions-data.js"></script>
<script src="assets/js/roster-data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/chat.js"></script>
<script>
	/* Conversations now come from the shared data layer (assets/js/
	   sessions-data.js) so a settlement-request message sent from
	   student-detail.html's Finance tab actually shows up here, and
	   anything sent from here persists across reloads. The list of WHO
	   to show comes from the shared roster (assets/js/roster-data.js),
	   not a fixed array -- so a student added after this page was first
	   built still shows up, with an empty thread until a first message
	   exists either way. */
	var CURRENT_TEACHER_ID = 'jane'; // this inbox always represents Jane Doe's logged-in view

	function renderSidebarAvatar() {
		var el = document.getElementById( 'sidebar-avatar' );
		if ( ! el ) { return; }
		var teacher = window.mahtelaRoster.loadTeachers()[ CURRENT_TEACHER_ID ];
		el.innerHTML = window.mahtelaRoster.avatarHTML( teacher, 'JD' );
	}
	renderSidebarAvatar();
	document.addEventListener( 'mahtela:teacherschange', renderSidebarAvatar );
	var CONVERSATIONS = window.mahtelaData.loadConversations();
	var activeKey = null;

	function myStudents() {
		var students = window.mahtelaRoster.loadStudents();
		return Object.keys( students )
			.map( function ( key ) { return students[ key ]; } )
			.filter( function ( s ) { return s.teacherId === CURRENT_TEACHER_ID; } );
	}

	function threadFor( key ) {
		return ( CONVERSATIONS[ key ] && CONVERSATIONS[ key ].messages ) ? CONVERSATIONS[ key ].messages : [];
	}

	function lastMessage( key ) {
		var msgs = threadFor( key );
		return msgs.length ? msgs[ msgs.length - 1 ] : null;
	}

	function plainText( html ) {
		var el = document.createElement( 'div' );
		el.innerHTML = html;
		return el.textContent || '';
	}

	function renderConversationList( filterText ) {
		var list = document.getElementById( 'conversation-list' );
		list.innerHTML = '';
		var q = ( filterText || '' ).trim().toLowerCase();
		var shown = 0;

		myStudents().forEach( function ( s ) {
			var key = s.key;
			if ( q && s.name.toLowerCase().indexOf( q ) === -1 ) { return; }
			shown++;

			var last = lastMessage( key );
			var btn = document.createElement( 'button' );
			btn.type = 'button';
			btn.className = 'chat-list__item' + ( key === activeKey ? ' is-active' : '' );
			btn.setAttribute( 'data-gender', s.gender );
			btn.setAttribute( 'aria-current', key === activeKey ? 'true' : 'false' );
			btn.innerHTML =
				'<span class="chat-list__avatar">' + s.initials + '</span>' +
				'<span class="chat-list__body">' +
					'<span class="chat-list__name">' + s.name + '</span>' +
					'<span class="chat-list__preview">' + ( last ? plainText( last.html ) : '' ) + '</span>' +
				'</span>' +
				'<span class="chat-list__meta"><span class="chat-list__time">' + ( last ? last.time : '' ) + '</span></span>';
			btn.addEventListener( 'click', function () { selectConversation( key ); } );
			list.appendChild( btn );
		} );

		document.getElementById( 'conversations-no-results' ).style.display = shown === 0 ? 'block' : 'none';
	}

	function renderThread( key ) {
		var student = window.mahtelaRoster.loadStudents()[ key ];
		var messages = threadFor( key );
		var thread = document.getElementById( 'chat-thread' );
		document.getElementById( 'active-thread-panel' ).setAttribute( 'data-gender', student.gender );
		thread.innerHTML = '';

		messages.forEach( function ( m ) {
			var bubble = document.createElement( 'div' );
			bubble.className = 'message-bubble message-bubble--' + m.dir;
			var avatar = m.dir === 'in'
				? '<span class="message-bubble__avatar">' + student.initials + '</span>'
				: '';
			var avatarOut = m.dir === 'out'
				? '<span class="message-bubble__avatar" style="background:var(--brand); color:var(--on-brand);">JD</span>'
				: '';
			bubble.innerHTML =
				avatar +
				'<div class="message-bubble__content"><div class="message-bubble__text">' + m.html + '</div><span class="message-bubble__time">' + m.time + '</span></div>' +
				avatarOut;
			thread.appendChild( bubble );
		} );
		thread.scrollTop = thread.scrollHeight;
	}

	function selectConversation( key ) {
		if ( ! window.mahtelaRoster.loadStudents()[ key ] ) { return; }
		activeKey = key;
		renderConversationList( document.getElementById( 'conversation-search' ).value );
		renderThread( key );
		if ( history.replaceState ) { history.replaceState( null, '', '?student=' + key ); }
		document.getElementById( 'composer-input' ).focus();
	}

	document.getElementById( 'conversation-search' ).addEventListener( 'input', function ( e ) {
		renderConversationList( e.target.value );
	} );

	document.querySelector( '.chat-composer' ).addEventListener( 'chat-composer:send', function ( e ) {
		if ( ! activeKey ) { return; }
		if ( ! CONVERSATIONS[ activeKey ] ) { CONVERSATIONS[ activeKey ] = { messages: [] }; }
		CONVERSATIONS[ activeKey ].messages.push( { dir: 'out', html: e.detail.html, time: window.mahtelaI18n.currentLang() === 'fa' ? 'اکنون' : 'Just now' } );
		window.mahtelaData.saveConversations( CONVERSATIONS );
		// mahtela:messageschange (dispatched by saveConversations) re-renders
		// both the thread and the list -- no need to do it again here.
	} );

	document.addEventListener( 'mahtela:langchange', function () {
		renderConversationList( document.getElementById( 'conversation-search' ).value );
	} );

	/* Single source of re-rendering whenever conversation data changes,
	   whether that's this page sending a message or another page (e.g.
	   a settlement request from student-detail.html's Finance tab). */
	document.addEventListener( 'mahtela:messageschange', function () {
		CONVERSATIONS = window.mahtelaData.loadConversations();
		renderConversationList( document.getElementById( 'conversation-search' ).value );
		if ( activeKey ) { renderThread( activeKey ); }
	} );

	document.addEventListener( 'mahtela:studentschange', function () {
		renderConversationList( document.getElementById( 'conversation-search' ).value );
	} );

	var params = new URLSearchParams( window.location.search );
	var initialKey = params.get( 'student' );
	var firstStudentKey = myStudents()[ 0 ] ? myStudents()[ 0 ].key : null;
	selectConversation( ( initialKey && window.mahtelaRoster.loadStudents()[ initialKey ] ) ? initialKey : firstStudentKey );
</script>
</body>
</html>
