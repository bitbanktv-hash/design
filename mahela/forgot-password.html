<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reset Password — MahELA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/animations.css">
<style>
	.auth-page { min-height: 100vh; display: flex; flex-direction: column; }
	.auth-topline { display: flex; align-items: center; justify-content: space-between; padding: 22px 28px; }
	.auth-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px 20px 60px; }
	.auth-card { width: 100%; max-width: 420px; padding: 36px; text-align: center; }
	.auth-brand { margin-bottom: 22px; }
	.auth-brand__title {
		font-family: var(--font-display); font-weight: 800; font-size: 26px;
		background: linear-gradient(120deg, var(--c-pink), var(--c-teal));
		-webkit-background-clip: text; background-clip: text; color: transparent;
	}
	.auth-brand__tagline { display: block; font-size: 10.5px; font-weight: 600; color: var(--ink-faint); margin-top: 3px; letter-spacing: .02em; }
	.forgot-icon {
		width: 52px; height: 52px; border-radius: 14px; background: var(--accent); opacity: 0.14;
		position: absolute;
	}
	.forgot-icon-wrap { width: 52px; height: 52px; border-radius: 14px; background: rgba(0,160,181,0.14); color: var(--accent-strong); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; }
	.auth-title { font-size: 20px; margin-bottom: 4px; }
	.auth-sub { font-size: 13.5px; margin-bottom: 24px; }
	.form-field { text-align: start; }
	.landing__footer { text-align: center; padding: 22px; font-size: 12.5px; color: var(--ink-faint); }
	.back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-soft); margin-top: 20px; }
	.back-link:hover { color: var(--brand); }
</style>
</head>
<body>

<div class="auth-page">
	<div class="auth-topline">
		<a href="index.html" class="clock-widget" data-clock-widget style="text-decoration:none;">
			<span class="clock-widget__icon">
				<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
			</span>
			<div class="clock-widget__dates">
				<span class="clock-widget__time" data-clock-time>--:--:--</span>
				<span class="clock-widget__date"><span data-clock-gregorian>—</span><span data-clock-sep> | </span><span data-clock-jalali>—</span></span>
			</div>
		</a>
		<div class="utility-toggles">
			<button type="button" class="toggle-btn lang-toggle" data-lang-btn>FA</button>
			<button type="button" class="toggle-btn" data-theme-btn aria-label="Toggle theme">
				<svg data-icon-moon viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
				<svg data-icon-sun viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
			</button>
		</div>
	</div>

	<div class="auth-main">
		<div class="card auth-card reveal-on-load" style="--rl-delay:0ms">
			<div class="auth-brand">
				<span class="auth-brand__title" data-i18n="brand_name">MahELA</span>
				<span class="auth-brand__tagline" data-i18n="brand_tagline">Mahta English Learning Academy</span>
			</div>

			<div id="forgot-form-view">
				<div class="forgot-icon-wrap">
					<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
				</div>
				<h1 class="auth-title" data-i18n="forgot_title">Reset your password</h1>
				<p class="auth-sub" data-i18n="forgot_sub">Enter your account email and we'll send you a reset link.</p>

				<form id="forgot-form">
					<div class="form-field">
						<label data-i18n="auth_email">Email</label>
						<input type="email" id="forgot-email" data-validate="email" placeholder="you@example.com" required>
						<span class="form-field__error" data-i18n="validate_email_error">Enter a valid email address.</span>
					</div>
					<button type="submit" class="btn btn--primary" style="width:100%;" data-i18n="forgot_send_btn">Send Reset Link</button>
				</form>
			</div>

			<div id="forgot-success-view" style="display:none;">
				<div class="forgot-icon-wrap" style="background:rgba(152,197,78,0.18); color:var(--success-strong);">
					<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
				</div>
				<p class="auth-sub" style="margin-bottom:0;" data-i18n="forgot_confirmation">If an account exists for that email, we've sent a reset link.</p>
			</div>

			<a href="login.html" class="back-link">
				<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
				<span data-i18n="forgot_back_login">Back to login</span>
			</a>
		</div>
	</div>

	<div class="landing__footer" data-i18n="footer_credit">Designed by Acc Manager</div>
</div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/clock.js"></script>
<script src="assets/js/app.js"></script>
<script>
	document.getElementById( 'forgot-form' ).addEventListener( 'submit', function ( e ) {
		e.preventDefault();
		if ( ! window.mahtelaValidate.validateForm( e.target ) ) { return; }
		document.getElementById( 'forgot-form-view' ).style.display = 'none';
		document.getElementById( 'forgot-success-view' ).style.display = 'block';
	} );
</script>
</body>
</html>
